spring.application.name=SafePickup

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/safe_pickup
spring.datasource.username=root
spring.datasource.password=

#spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# HERE API:
here.api.key=${HERE_API_KEY}
here.api.flow-url=https://data.traffic.hereapi.com/v7/flow

# twilio API
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH-TOKEN}
twilio.verify.service.sid=${TWILIO_SERVICE_SID}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000